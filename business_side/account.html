<!DOCTYPE html>
<html>
    <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>@C-zaWena#homepage</title>
        <link  href="style.css" rel="stylesheet">
         </head>
    <body>

         <input type="checkbox" id="tick" class="inp_btn">
 <header>
        <div class="mainInfo">
          <div style="display: flex; flex-wrap:mwrap; flex-direction: row; gap: 20px; justify-content: center; align-items: center;">
         <img src="/home/klogo.png" alt="logo" class="logo">
         <h1 style="margin-left: 1%;"> CzWena </h1>   
          </div> 
      </header>

      <div class="paymentForm">
        <h2 style="color: rgb(251, 109, 20);">C-zWena</h2>  
      <form style="display: flex; flex-wrap: wrap; flex-direction: column;  color:#5b6e2e" id="visibleForm">
        <label>Enter Business name:</label>
        <input name="business_name"/>
        <label>Service  Type:</label>
        <select name="service">
          <option>
            Funeral service provider
          </option>
          <option>
            Rental Property
          </option>
        </select>
        <label>Enter  ID  Number:</label>
        <input name="ID"  />
        <label>Enter  Phone Number:</label>
        <input name="phone_number"  />
        <label>Bank Name:</label>
        <input name="bank_name" />
        <label>Bank Account:</label>
        <input name="account_number" />
        <input style="background-color: green; color:antiquewhite; margin-top: 5%;" type="submit" value="SUBMIT">
        </form>
      </div>

  
    <footer>

        <div class="end">
           <p>
            @Mthiyane_Software Solutions
           </p>
           <p> C-zaWena  online payment platform for cash users</p>
        </div>

    </footer>
      <script>
    document.getElementById("visibleForm").addEventListener('submit',async function(event){
     event.preventDefault();
    
     const myform = document.getElementById("visibleForm");
     const sentForm = new FormData(myform);

     const response = await fetch('https://project.c-zwena.co.za/sign_up',
      {
        method:'Post',
        body: sentForm
      });

   
      if (!response.ok){
        throw new Error(`HTTP error: ${response.status}`);
            }

      const data = await response.json();
      console.log("Do for dollars ")
      const status = data.status;
      console.log('Success:', status);
      if(status == "OK"){
        console.log('Smile')
        window.location.assign("welcome.html");
      }
      });

                   </script>
    </body>
    

</html>
